# Métricas de negócio e HTTP de cada serviço (prom-client em /api/metrics).
# Os serviços rodam em container na rede oficina-local (docker compose de cada repo).
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: oficina-os-service
    metrics_path: /api/metrics
    static_configs:
      - targets: ['oficina-os-api-1:3001']
        labels: { servico: os-service }
  - job_name: oficina-billing-service
    metrics_path: /api/metrics
    static_configs:
      - targets: ['oficina-billing-api-1:3002']
        labels: { servico: billing-service }
  - job_name: oficina-execution-service
    metrics_path: /api/metrics
    static_configs:
      - targets: ['oficina-execution-api-1:3003']
        labels: { servico: execution-service }
