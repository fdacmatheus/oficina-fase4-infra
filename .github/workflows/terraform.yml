name: Terraform · Plataforma

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      destroy:
        description: 'Executar terraform destroy em vez de apply'
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.13.0
  TF_IN_AUTOMATION: 'true'

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: terraform

jobs:
  validate:
    name: Validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o gitleaks varre o historico

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Formatacao
        run: terraform fmt -check -recursive

      - name: Init sem backend
        run: terraform init -backend=false -input=false

      - name: Validar
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          tflint --init
          tflint --format compact

      - name: Validar JSON dos dashboards
        run: |
          for f in dashboards/*.json ../local/observabilidade/grafana/dashboards/*.json; do
            jq empty "$f" || { echo "JSON invalido: $f"; exit 1; }
          done

      - name: Validar YAML do ambiente local
        working-directory: .
        run: |
          find local .github -name '*.y*ml' -print0 \
            | xargs -0 -n1 python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1])); print("ok:", sys.argv[1])'

  # Plan e apply so rodam quando a conta do Learner Lab esta ligada: as
  # credenciais de sessao expiram a cada laboratorio, e um pipeline vermelho por
  # credencial vencida nao diz nada sobre o codigo.
  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init (backend S3 da conta)
        run: |
          CONTA=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false \
            -backend-config="bucket=oficina-tfstate-$CONTA" \
            -backend-config="key=plataforma/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Plan
        run: terraform plan -input=false -no-color 2>&1 | tee plan.txt

      - name: Comentar o plan no PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const body = `#### Terraform Plan — Plataforma\n\n<details><summary>Ver plano</summary>\n\n\`\`\`hcl\n${plan.slice(-60000)}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  apply:
    name: Apply
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    environment: producao
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init (backend S3 da conta)
        run: |
          CONTA=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false \
            -backend-config="bucket=oficina-tfstate-$CONTA" \
            -backend-config="key=plataforma/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Apply
        if: ${{ !inputs.destroy }}
        run: terraform apply -input=false -auto-approve

      - name: Destroy
        if: ${{ inputs.destroy }}
        run: terraform destroy -input=false -auto-approve

      - name: Resumo
        if: ${{ !inputs.destroy }}
        run: |
          aws eks update-kubeconfig --name "$(terraform output -raw cluster_name)" --region "$AWS_REGION"
          {
            echo "### Plataforma provisionada"
            echo '```'
            echo "API Gateway: $(terraform output -raw api_gateway_url)"
            echo "Grafana:     $(terraform output -raw grafana_url)"
            kubectl get nodes
            kubectl -n monitoring get pods
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
